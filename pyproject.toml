[project]
name = "ml-lab"
version = "0.1.0"
description = "This repository is for personal AI/ML practices."
readme = "README.md"
authors = [
    { name = "Yeongmin Lee", email = "munain0417@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "torch>=2.14.0",
]

[project.scripts]
ml-lab = "ml_lab:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
